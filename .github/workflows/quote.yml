name: Update Quote

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight
  workflow_dispatch:  # Allows manual triggering

jobs:
  update-quote:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # Latest version

      - name: Setup Node.js
        uses: actions/setup-node@v4  # Latest version
        with:
          node-version: "20"  # Latest LTS version

      - name: Install Dependencies
        run: npm install axios fs

      - name: Fetch New Quote
        run: node fetch_quote.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add QUOTE.md
          git commit -m "Updated Quote"
          git push
        shell: bash
